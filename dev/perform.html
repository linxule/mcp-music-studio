<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MCP Music Studio — performance page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0b0b10; overflow: hidden;
      font-family: -apple-system, "SF Pro Display", Inter, Helvetica, Arial, sans-serif; color: #f2f0ff; }
    #stage { position: fixed; inset: 0; }
    /* The widgets lay out at 1422×800 and are scaled ×1.35 to 1920×1080, so the code reads at 1080p.
       transform, not zoom: OBS's CEF ignores zoom on iframes. */
    .frame { position: absolute; left: 0; top: 0; width: var(--fw, 1422px); height: var(--fh, 800px); transform: scale(1.35); transform-origin: 0 0; border: 0; background: #0b0b10;
      opacity: 0; transition: opacity 1.8s ease; }
    .frame.on { opacity: 1; }
    .frame.gone { visibility: hidden; }
    /* Captions live over the visuals; nothing is a slide. */
    #caption { position: absolute; left: 56px; bottom: 48px; max-width: var(--capw, 46vw); pointer-events: none;
      opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform .9s ease; }
    #caption.on { opacity: 1; transform: none; }
    #caption .n { font: 600 15px/1 "SF Mono", Menlo, monospace; letter-spacing: .22em; color: #bcb2ff; text-transform: uppercase; }
    #caption .t { margin-top: 10px; font-size: 38px; font-weight: 700; letter-spacing: -.01em; text-shadow: 0 2px 24px rgba(0,0,0,.7); }
    #caption .s { margin-top: 8px; font-size: 20px; color: #d9d5f0; text-shadow: 0 1px 14px rgba(0,0,0,.8); }
    #caption code { font-family: "SF Mono", Menlo, monospace; color: #ffd580; font-size: .92em; }
    #brand { position: absolute; right: 56px; bottom: 52px; pointer-events: none; text-align: right;
      font: 500 15px/1.5 "SF Mono", Menlo, monospace; color: rgba(242,240,255,.62); text-shadow: 0 1px 10px rgba(0,0,0,.8);
      opacity: 0; transition: opacity 1.2s ease; }
    #brand.on { opacity: 1; }
    #veil { position: absolute; inset: 0; background: #0b0b10; opacity: 1; transition: opacity 2.4s ease; pointer-events: none; }
    #veil.off { opacity: 0; }
    #go { position: absolute; inset: 0; display: grid; place-items: center; background: #0b0b10; cursor: pointer; z-index: 10;
      font-size: 22px; color: #bcb2ff; letter-spacing: .1em; }
    #go[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <iframe id="strudel" class="frame" allow="autoplay; clipboard-write"></iframe>
    <div id="veil"></div>
    <div id="caption"><div class="n"></div><div class="t"></div><div class="s"></div></div>
    <div id="brand">mcp-music-studio 0.5<br>npx mcp-music-studio</div>
  </div>
  <div id="go">click to perform — or open with ?autoplay=1</div>
  <script type="module" src="./perform.ts"></script>
</body>
</html>
