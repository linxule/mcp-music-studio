name: CI

# Verify gate. publish-mcp.yml is tag-only, so this is what catches regressions
# before release. It runs on every PR to main AND on main itself — a PR gate
# alone leaves direct pushes and merge results unverified, which is exactly the
# state a tag then gets cut from.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build   # runs `tsc --noEmit` inline (no standalone typecheck script)
      - run: bunx vitest run

      - name: Install Chromium for audio regression
        run: bunx playwright install --with-deps chromium
      - name: Verify browser audio and exports
        run: bun run test:audio
      - name: Verify published source and notices
        run: bun run test:package
      - name: Keep failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audio-failure
          path: test-results/
          retention-days: 7

      # The Worker is a separate package with its own lockfile and tsconfig, and
      # it is deployed by hand (not from CI) — so nothing else typechecks it.
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: bunx tsc --noEmit
        working-directory: worker
      - name: Audit dependency locks
        run: |
          bun audit
          (cd worker && bun audit)
      - name: Build worker without deploying
        run: bunx wrangler deploy --dry-run --outdir /tmp/music-worker-build
        working-directory: worker
      - name: Verify real worker HTTP transport
        run: node --test tests/mcp.test.mjs
        working-directory: worker
