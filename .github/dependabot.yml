version: 2
updates:
  # Root Bun package (bun.lock) — mcp-music-studio (published).
  # Each ecosystem is GROUPED (patterns: ["*"]) into a single PR so a refresh is
  # ~one PR per ecosystem, not one per dependency (avoids the first-run flood).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    # tonal 6.5.0 ships main/types pointing at dist/index.js / index.d.ts, which
    # are not in the package (only .cjs/.mjs/.d.cts/.d.mts): tsc can't resolve it.
    # Our build bundles tonal, so the published server was never affected.
    ignore:
      - dependency-name: "tonal"
        versions: ["6.5.0"]
    groups:
      root-deps:
        patterns: ["*"]

  # Cloudflare Worker package (worker/bun.lock) — private, deploy-only.
  - package-ecosystem: "bun"
    directory: "/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "tonal"
        versions: ["6.5.0"]
    groups:
      worker-deps:
        patterns: ["*"]

  # GitHub Actions (checkout, setup-node, setup-bun pinned in workflows).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
